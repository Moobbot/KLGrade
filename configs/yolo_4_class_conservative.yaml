# YOLOv11 Training Configuration - 4-class with Conservative Augmentation
# Dataset: Knee OA Detection (KL1-4, no KL0)

path: E:\CaoHoc\thesis\KLGrade
train: splits/knee_4_class/train.txt
val: splits/knee_4_class/val.txt
test: splits/knee_4_class/test.txt

# Dataset
nc: 4
names: ['KL1', 'KL2', 'KL3', 'KL4']

# Model
model: yolo11n.pt

# Hyperparameters
epochs: 100
patience: 20
batch: 16
imgsz: 640
device: 0

# Optimizer
optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005

# Loss
box: 7.5
cls: 0.5
dfl: 1.5

# Conservative Augmentation
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.015
degrees: 5.0
translate: 0.1
scale: 0.1
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0

# Training
save: True
save_period: 10
cache: False
workers: 4
project: runs/detect
name: knee_4_class_conservative
exist_ok: False
pretrained: True
verbose: True
seed: 42
deterministic: True
plots: True
