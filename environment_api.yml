# KLGrade API Environment
# Updated to use pip for PyTorch installation to avoid DLL issues on Windows

name: klgrade_api
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - pip:
      # PyTorch with CUDA 12.1 (via pip to avoid DLL loading issues)
      - torch --index-url https://download.pytorch.org/whl/cu121
      - torchvision --index-url https://download.pytorch.org/whl/cu121
      
      # API Framework
      - fastapi>=0.100.0
      - uvicorn>=0.20.0
      - python-multipart>=0.0.6
      - pydantic>=2.0.0
      
      # Deep Learning & Transformers
      - ultralytics>=8.3.0
      - transformers>=4.57.3
      - timm>=0.16.0
      - einops>=0.7.0
      
      # Image Processing
      - opencv-python>=4.8.0
      - albumentations>=1.3.0
      - pydicom
      - Pillow>=9.5
      - pycocotools>=2.0.4
      - PyWavelets>=1.4.0
      
      # Scientific Computing
      - numpy>=1.24
      - pandas>=2.0
      - scikit-learn>=1.2
      - scipy>=1.10.0
      - matplotlib>=3.7
      - torchmetrics>=1.0.0
      
      # Utilities
      - tqdm>=4.65.0
      - PyYAML>=6.0
      - natsort>=8.4.0
      - wandb>=0.16.0
