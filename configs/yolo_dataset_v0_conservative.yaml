# YOLOv11 Training Configuration - Dataset V0 Conservative
# Dataset: Original dataset_v0 (KL0-4)
# Mode: Conservative Augmentation

# Paths
path: .
train: processed/splits/dataset_v0/train.txt
val: processed/splits/dataset_v0/val.txt
test: processed/splits/dataset_v0/test.txt

# Dataset
nc: 5  # Number of classes
names: ['KL0', 'KL1', 'KL2', 'KL3', 'KL4']  # Class names

# Model
model: yolo11l.pt  # Pretrained weights (large for better accuracy)

# Hyperparameters
epochs: 100
patience: 20  # Early stopping patience
batch: 8  # Batch size
imgsz: 640  # Image size
device: 0  # GPU device

# Optimizer
optimizer: AdamW
lr0: 0.001  # Initial learning rate
lrf: 0.01  # Final learning rate (lr0 * lrf)
momentum: 0.937
weight_decay: 0.0005

# Loss
box: 7.5  # Box loss gain
cls: 0.5  # Class loss gain
dfl: 1.5  # Distribution focal loss gain

# Augmentation (Conservative for medical images)
hsv_h: 0.005  # HSV-Hue (very minimal)
hsv_s: 0.3  # HSV-Saturation (reduced)
hsv_v: 0.2  # HSV-Value (reduced)
degrees: 3.0  # Rotation (±3°)
translate: 0.05  # Translation (5%)
scale: 0.3  # Scale (±30%)
shear: 0.0  # Shear (disabled)
perspective: 0.0  # Perspective (disabled)
flipud: 0.0  # Flip up-down (disabled for X-rays)
fliplr: 0.5  # Flip left-right (50% - knees are symmetric)
mosaic: 0.0  # Mosaic (disabled for medical)
mixup: 0.0  # MixUp (disabled for medical)
copy_paste: 0.0  # Copy-paste (disabled)

# Validation
save: True
save_period: 10  # Save checkpoint every N epochs
plots: True
conf: 0.001  # Confidence threshold
iou: 0.6  # NMS IoU threshold
max_det: 300  # Maximum detections per image
