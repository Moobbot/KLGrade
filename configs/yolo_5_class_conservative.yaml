# YOLOv11 Training Configuration - 5-class with Conservative Augmentation
# Dataset: Knee OA Detection (KL0-4)
# Mode: Conservative augmentation

# Paths
path: .
train: splits/knee_5_class/train.txt
val: splits/knee_5_class/val.txt
test: splits/knee_5_class/test.txt

# Dataset
nc: 5
names: ['KL0', 'KL1', 'KL2', 'KL3', 'KL4']

# Model
model: yolo11n.pt

# Hyperparameters
epochs: 100
patience: 20
batch: 16
imgsz: 640
device: 0

# Optimizer
optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005

# Loss
box: 7.5
cls: 0.5
dfl: 1.5

# Conservative Augmentation (matching src/datasets/augmentation.py)
hsv_h: 0.0  # No color jitter (grayscale X-rays)
hsv_s: 0.0
hsv_v: 0.015  # Slight value variation
degrees: 5.0  # ±5° rotation
translate: 0.1  # ±10% translation
scale: 0.1  # ±10% scale
shear: 0.0  # No shear
perspective: 0.0  # No perspective
flipud: 0.0  # No vertical flip (anatomically incorrect)
fliplr: 0.5  # 50% horizontal flip (L/R symmetry OK)
mosaic: 0.0  # No mosaic for baseline
mixup: 0.0  # No mixup
copy_paste: 0.0  # No copy-paste yet

# Training
save: True
save_period: 10
cache: False
workers: 4
project: runs/detect
name: knee_5_class_conservative
exist_ok: False
pretrained: True
verbose: True
seed: 42
deterministic: True
plots: True
